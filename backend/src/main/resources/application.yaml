spring:
  application:
    name: Proyecto1-Archivos-MIniERP

  mvc:
    servlet:
      path: "/api/v1"
  
  datasource:
    url: jdbc:postgresql://localhost:5432/mini_erp_muebles
    username: postgres
    password: 010418

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

jwt:
  secret: "MiniERP-JWT-Secret-Key-Proyecto-Archivos-Segundo-Semestre"
  expiration: 3600000