<div class="min-h-screen bg-gray-50 p-6">
  <div class="mx-auto max-w-5xl">

    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold text-gray-800">Movimientos de Inventario</h1>
      <button type="button" (click)="regresarPanel()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
        Volver al panel
      </button>
    </div>

    <div class="mb-4 rounded-xl bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-4">
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-500">Producto</label>
          <select [(ngModel)]="filtro.idProducto" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            <option [ngValue]="null" disabled>Selecciona</option>
            @for (p of productos; track p.idProducto) {
            <option [ngValue]="p.idProducto">{{ p.nombreProducto }}</option>
            }
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-500">Desde</label>
          <input type="datetime-local" [(ngModel)]="filtro.desde"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-500">Hasta</label>
          <input type="datetime-local" [(ngModel)]="filtro.hasta"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" />
        </div>
        <div class="flex items-end">
          <button type="button" (click)="buscar()"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-sm text-white hover:bg-indigo-700">
            Buscar
          </button>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto rounded-xl bg-white shadow-sm">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-gray-500">Fecha</th>
            <th class="px-4 py-3 text-left font-medium text-gray-500">Tipo</th>
            <th class="px-4 py-3 text-left font-medium text-gray-500">Motivo</th>
            <th class="px-4 py-3 text-right font-medium text-gray-500">Cantidad</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (m of movimientos; track m.idMovimiento) {
          <tr>
            <td class="px-4 py-3">{{ m.fechaMovimiento | date: 'dd/MM/yyyy HH:mm' }}</td>
            <td class="px-4 py-3">
              <span [class]="m.tipoMovimiento === 'ENTRADA'
                ? 'rounded-full bg-green-100 px-2 py-1 text-xs font-medium text-green-700'
                : 'rounded-full bg-red-100 px-2 py-1 text-xs font-medium text-red-700'">
                {{ m.tipoMovimiento }}
              </span>
            </td>
            <td class="px-4 py-3">{{ m.motivo }}</td>
            <td class="px-4 py-3 text-right font-medium">{{ m.cantidad }}</td>
          </tr>
          } @empty {
          <tr>
            <td colspan="4" class="px-4 py-6 text-center text-gray-400">Selecciona un producto para ver movimientos</td>
          </tr>
          }
        </tbody>
      </table>
    </div>

  </div>
</div>
